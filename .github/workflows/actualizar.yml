name: actualizar-plataforma
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          BDG_PLATAFORMA_PASSWORD: ${{ secrets.BDG_PLATAFORMA_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      - run: |
          git config user.name "bdg-bot"
          git config user.email "bot@uguetoai.com"
          git add data.enc.json
          git diff --cached --quiet || (git commit -m "Actualiza datos del día" && git push)
